name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint workflows with actionlint
        shell: bash
        run: |
          set -euo pipefail
          actionlint_dir="${RUNNER_TEMP}/actionlint-1.7.12"
          archive="${actionlint_dir}/actionlint_1.7.12_linux_amd64.tar.gz"
          checksum_file="${actionlint_dir}/actionlint_1.7.12_linux_amd64.tar.gz.sha256"
          mkdir --parents "$actionlint_dir"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$archive" > "$checksum_file"
          sha256sum --check --status "$checksum_file"
          tar --extract --gzip --file "$archive" --directory "$actionlint_dir" actionlint
          "$actionlint_dir/actionlint" .github/workflows/*.yml
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build extension
        run: pnpm build

      - name: Build full-product Edge extension
        run: pnpm build:edge

      - name: Check full-product Edge output
        run: pnpm check:edge-output

      - name: Run test suite
        run: pnpm test

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload full-product Edge dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-edge-${{ github.sha }}
          path: dist-edge
          if-no-files-found: error
          retention-days: 7
