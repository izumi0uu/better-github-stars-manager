name: E2E Firefox Verification

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: e2e-firefox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-firefox-stable:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Firefox stable
        run: pnpm exec puppeteer browsers install firefox

      - name: Resolve Firefox stable executable
        shell: bash
        run: |
          set -euo pipefail
          firefox_stable="$(pnpm exec puppeteer browsers install firefox --format '{{path}}')"
          test -x "$firefox_stable"
          printf 'FIREFOX_EXECUTABLE=%s\n' "$firefox_stable" >> "$GITHUB_ENV"

      - name: Build Firefox extension
        run: pnpm build:firefox

      - name: Check Firefox output
        run: pnpm check:firefox-output

      - name: Lint Firefox extension with web-ext
        run: pnpm lint:firefox

      - name: Run Firefox stable smoke
        env:
          CI: 'true'
          PUPPETEER_HEADLESS: 'false'
        run: xvfb-run -a pnpm test:smoke:firefox

      - name: Upload Firefox stable diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-firefox-stable-${{ github.sha }}
          path: dist-firefox
          if-no-files-found: error
          retention-days: 7

  verify-firefox-versions:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Firefox stable
        run: pnpm exec puppeteer browsers install firefox

      - name: Install Firefox 140 minimum
        run: pnpm exec puppeteer browsers install firefox@stable_140.0.4

      - name: Resolve Firefox executable paths
        id: firefox-paths
        shell: bash
        run: |
          set -euo pipefail
          stable_executable="$(pnpm exec puppeteer browsers install firefox --format '{{path}}')"
          minimum_executable="$(pnpm exec puppeteer browsers install firefox@stable_140.0.4 --format '{{path}}')"
          test -x "$stable_executable"
          test -x "$minimum_executable"
          test "$stable_executable" != "$minimum_executable"
          printf 'stable=%s\n' "$stable_executable" >> "$GITHUB_OUTPUT"
          printf 'minimum=%s\n' "$minimum_executable" >> "$GITHUB_OUTPUT"

      - name: Build Firefox extension
        run: pnpm build:firefox

      - name: Check Firefox output
        run: pnpm check:firefox-output

      - name: Verify Firefox stable and minimum versions
        env:
          CI: 'true'
          PUPPETEER_HEADLESS: 'false'
          FIREFOX_STABLE_EXECUTABLE: ${{ steps.firefox-paths.outputs.stable }}
          FIREFOX_140_EXECUTABLE: ${{ steps.firefox-paths.outputs.minimum }}
        run: xvfb-run -a pnpm test:verify-firefox

      - name: Upload Firefox version diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-firefox-versions-${{ github.sha }}
          path: dist-firefox
          if-no-files-found: error
          retention-days: 7
