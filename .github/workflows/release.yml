name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to_chrome_web_store:
        description: 'Manually submit the verified tagged package to Chrome Web Store'
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GSM_ARTIFACTS_DIR: artifacts
      GSM_VERSION_APPROVAL: ${{ vars.GSM_VERSION_APPROVAL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$TAG_NAME" = "v$package_version"

      - name: Run integrated Agent runtime verification
        run: pnpm verify:agent-runtime

      - name: Finalize release evidence
        run: pnpm verify:agent-release-gates

      - name: Enumerate canonical release files
        id: release-artifacts
        run: |
          artifact_list="$RUNNER_TEMP/release-artifacts.txt"
          node scripts/verify-agent-release-gates.mjs --list-release-artifacts > "$artifact_list"
          {
            echo 'files<<EOF'
            cat "$artifact_list"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ github.sha }}
          path: ${{ steps.release-artifacts.outputs.files }}
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mapfile -t release_files < "$RUNNER_TEMP/release-artifacts.txt"
          test "${#release_files[@]}" -gt 0
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${release_files[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${release_files[@]}" --generate-notes --title "$TAG_NAME"
          fi

      - name: Conditionally publish to Chrome Web Store
        if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') && inputs.publish_to_chrome_web_store == true && vars.CWS_DEPLOY_ENABLED == 'true' }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_PUBLISH_TYPE: ${{ vars.CWS_PUBLISH_TYPE }}
          CWS_SKIP_REVIEW: ${{ vars.CWS_SKIP_REVIEW }}
        run: |
          zip_path=""
          while IFS= read -r candidate; do
            case "$candidate" in
              *.zip) test -z "$zip_path"; zip_path="$candidate" ;;
            esac
          done < "$RUNNER_TEMP/release-artifacts.txt"
          test -n "$zip_path"
          node scripts/publish-chrome-web-store.mjs "$zip_path"
