name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to_chrome_web_store:
        description: 'Manually submit the verified tagged package to Chrome Web Store'
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GSM_ARTIFACTS_DIR: artifacts
      GSM_VERSION_APPROVAL: ${{ vars.GSM_VERSION_APPROVAL }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$TAG_NAME" = "v$package_version"

      - name: Install Chrome for Testing
        run: pnpm exec puppeteer browsers install chrome

      - name: Run integrated Agent runtime verification
        run: pnpm verify:agent-runtime

      - name: Finalize release evidence
        run: pnpm verify:agent-release-gates

      - name: Enumerate canonical release files
        id: release-artifacts
        run: |
          artifact_list="$RUNNER_TEMP/release-artifacts.txt"
          node scripts/verify-agent-release-gates.mjs --list-release-artifacts > "$artifact_list"
          {
            echo 'files<<EOF'
            cat "$artifact_list"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts-${{ github.sha }}
          path: ${{ steps.release-artifacts.outputs.files }}
          if-no-files-found: error
          retention-days: 14

      - name: Create or verify immutable GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mapfile -t release_files < "$RUNNER_TEMP/release-artifacts.txt"
          test "${#release_files[@]}" -gt 0
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            existing_release_dir="$(mktemp -d "$RUNNER_TEMP/existing-release.XXXXXX")"
            expected_asset_names="$existing_release_dir/expected-asset-names.txt"
            actual_asset_names="$existing_release_dir/actual-asset-names.txt"
            printf '%s\n' "${release_files[@]##*/}" | LC_ALL=C sort > "$expected_asset_names"
            gh release view "$TAG_NAME" --json assets --jq '.assets[].name' |
              LC_ALL=C sort > "$actual_asset_names"
            if ! cmp -s "$expected_asset_names" "$actual_asset_names"; then
              echo "Existing GitHub Release asset inventory differs from the canonical release artifacts; refusing to mutate immutable assets." >&2
              exit 1
            fi
            gh release download "$TAG_NAME" --dir "$existing_release_dir/downloaded"
            for release_file in "${release_files[@]}"; do
              asset_name="${release_file##*/}"
              if ! cmp -s "$release_file" "$existing_release_dir/downloaded/$asset_name"; then
                echo "Existing GitHub Release asset $asset_name differs from the canonical release artifact; refusing to mutate immutable assets." >&2
                exit 1
              fi
            done
          else
            gh release create "$TAG_NAME" "${release_files[@]}" --generate-notes --title "$TAG_NAME"
          fi

      - name: Conditionally publish to Chrome Web Store
        if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') && inputs.publish_to_chrome_web_store == true && vars.CWS_DEPLOY_ENABLED == 'true' }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_PUBLISH_TYPE: ${{ vars.CWS_PUBLISH_TYPE }}
          CWS_SKIP_REVIEW: ${{ vars.CWS_SKIP_REVIEW }}
        run: |
          zip_path=""
          while IFS= read -r candidate; do
            case "$candidate" in
              *.zip) test -z "$zip_path"; zip_path="$candidate" ;;
            esac
          done < "$RUNNER_TEMP/release-artifacts.txt"
          test -n "$zip_path"
          node scripts/publish-chrome-web-store.mjs "$zip_path"
